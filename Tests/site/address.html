<!doctype html><meta charset=utf-8><title>Pane address form</title>
<form id=f>
<input id=n name=fullname placeholder="Full name">
<input id=e type=email name=email_address>
<input id=t type=tel name=phone>
<input id=a1 autocomplete="address-line1" name=a1>
<input id=city name=city_name placeholder="City">
<input id=zip name=zipcode>
<select id=country name=country><option value="">-</option><option value="US">United States</option><option value="RU">Russia</option></select>
<hr>
<input id=cc autocomplete="cc-number" name=x1>
<input id=ccn name=cardholder placeholder="Name on card">
<select id=mm autocomplete="cc-exp-month"><option>01</option><option>02</option><option>03</option><option>04</option></select>
<input id=yy placeholder="YYYY" name=expyear maxlength=4>
</form>
