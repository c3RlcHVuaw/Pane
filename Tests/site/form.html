<!doctype html><meta charset=utf-8><title>Pane test form</title>
<style>body{font:16px system-ui;margin:40px;max-width:560px}label{display:block;margin:14px 0 4px}input,select,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #bbb}button{background:#2563eb;color:#fff;border:0}#result{margin-top:24px;padding:14px;border-radius:10px;background:#e8f7ec;display:none}</style>
<h1>Contact form</h1>
<form id=f>
<label for=n>Your name</label><input id=n name=name placeholder="Name">
<label for=c>Favourite colour</label><select id=c name=colour><option>Red</option><option>Green</option><option>Blue</option></select>
<label><input type=checkbox id=ok name=ok> I agree to be contacted</label>
<p><button type=submit>Send</button></p>
<label for=p>Password</label><input id=p type=password name=password placeholder="Password">
</form>
<div id=result></div>
<script>f.addEventListener('submit',e=>{e.preventDefault();result.style.display='block';result.textContent='Thanks '+n.value+' ('+c.value+', agreed='+ok.checked+')';});</script>
